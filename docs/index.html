<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Operacional — 20/08/2026 | PortoEx</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#080e18;--card:#0f1623;--card2:#141d2e;--border:#1e2a3a;
  --text:#dce5f0;--sub:#6b7a91;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
  --blue:#3b82f6;--purple:#a78bfa;--orange:#F47523;--teal:#06b6d4;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

/* ── HEADER ─────────────────────────────────────────────────────── */
header{
  background:linear-gradient(135deg,#0c1525 0%,#111d30 100%);
  border-bottom:1px solid var(--border);
  padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
}
.hd-left{display:flex;align-items:center;gap:16px;}
.hd-logo{height:48px;width:auto;filter:drop-shadow(0 2px 8px rgba(244,117,35,.3));}
.hd-title-block{border-left:2px solid var(--orange);padding-left:14px;}
.hd-title{font-size:1.1rem;font-weight:700;color:var(--text);letter-spacing:.3px;}
.hd-subtitle{font-size:.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}
.hd-right{display:flex;gap:28px;flex-wrap:wrap;}
.hd-date-item{text-align:right;}
.hd-date-label{font-size:.62rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;}
.hd-date-val{font-size:.88rem;font-weight:600;color:var(--text);margin-top:1px;}

/* ── TABS ────────────────────────────────────────────────────────── */
.tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 32px;display:flex;gap:2px;overflow-x:auto;}
.tab{padding:13px 22px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--sub);
     border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}

/* ── CONTENT ─────────────────────────────────────────────────────── */
.content{padding:24px 32px;max-width:1440px;margin:0 auto;}

/* ── KPI ROW ─────────────────────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:22px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px 16px;
     position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--orange);border-radius:3px 0 0 3px;}
.kpi-label{font-size:.65rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
.kpi-val{font-size:1.3rem;font-weight:700;}
.g{color:var(--green);}.r{color:var(--red);}.b{color:var(--blue);}.y{color:var(--yellow);}

/* ── SECTION ─────────────────────────────────────────────────────── */
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;}
.sec-title{font-size:.72rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:16px;}

/* ── CHARTS ──────────────────────────────────────────────────────── */
.charts-row{display:grid;grid-template-columns:3fr 3fr 2fr;gap:14px;margin-bottom:18px;}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.chart-title{font-size:.7rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
canvas{max-height:240px;}

/* ── CHARTS CONSOLIDADO ─────────────────────────────────────────── */
.charts-row-2{display:grid;grid-template-columns:2fr 1fr 2fr;gap:14px;margin-bottom:18px;}

/* ── TABLE ───────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:.8rem;}
th{text-align:left;padding:8px 10px;color:var(--sub);font-weight:600;text-transform:uppercase;font-size:.67rem;letter-spacing:.4px;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid #131d2c;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}

/* ── BADGES ──────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.2px;}
.badge-g{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.badge-r{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.badge-b{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25);}
.num-g{color:var(--green);font-weight:600;}.num-r{color:var(--red);font-weight:600;}.num-b{color:var(--blue);}
.mgnum-g{color:var(--green);font-weight:700;}.mgnum-b{color:var(--blue);font-weight:700;}.mgnum-r{color:var(--red);font-weight:700;}

/* ── OP CARDS ────────────────────────────────────────────────────── */
.op-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px;}
.op-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:18px;
         transition:border-color .2s;}
.op-card:hover{border-color:rgba(244,117,35,.3);}
.op-name{font-size:.98rem;font-weight:700;margin-bottom:2px;}
.op-trecho{font-size:.72rem;color:var(--sub);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.op-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.op-stat{background:var(--card);border-radius:8px;padding:8px 10px;border:1px solid var(--border);}
.op-stat-label{font-size:.62rem;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;}
.op-stat-val{font-size:.86rem;font-weight:700;margin-top:2px;}
.prog-bar{height:4px;background:#1a2535;border-radius:3px;margin-top:8px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;}

/* ── ALERTS ──────────────────────────────────────────────────────── */
.alert-box{border-radius:8px;padding:10px 14px;margin-bottom:9px;font-size:.78rem;border-left:3px solid;display:flex;align-items:flex-start;gap:8px;}
.alert-r{background:rgba(239,68,68,.08);border-color:var(--red);color:#fca5a5;}
.alert-b{background:rgba(59,130,246,.08);border-color:var(--blue);color:#93c5fd;}
.alert-y{background:rgba(245,158,11,.08);border-color:var(--yellow);color:#fcd34d;}

/* ── CONSOLIDADO GERAL — REDESIGN ────────────────────────────────── */
.cg-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.cg-filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.cg-filter-label{font-size:.72rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;}
.cg-filter-sep{color:var(--sub);font-size:.9rem;padding:0 2px;}
.cg-date-input{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.8rem;cursor:pointer;outline:none;transition:border-color .15s;}
.cg-date-input:focus{border-color:var(--orange);}
.cg-btn{padding:6px 14px;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--sub);background:var(--bg2);transition:all .15s;}
.cg-btn:hover{border-color:var(--orange);color:var(--orange);}
.cg-btn-primary{border-color:var(--orange);color:var(--orange);background:rgba(244,117,35,.08);}

/* KPI */
.cg-kpi-row{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:24px;align-items:stretch;}
.cg-kpi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-height:68px;}
.cg-kpi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;align-self:center;}
.cg-kpi-label{font-size:.64rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.cg-kpi-val{font-size:1.05rem;font-weight:700;line-height:1.1;}

/* Charts */
.cg-charts-row{display:grid;grid-template-columns:3fr 1fr;gap:16px;margin-bottom:22px;}
.cg-chart-main,.cg-chart-side{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.cg-chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cg-chart-title{font-size:.68rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
.cg-donut-legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.cg-dl-item{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--sub);}
.cg-dl-item span{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* Destaques */
.cg-dest-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
.cg-dest-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.cg-dest-badge{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.cg-dest-nome{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.cg-dest-sub{font-size:.73rem;color:var(--sub);margin-bottom:6px;}
.cg-dest-trecho{font-size:.72rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px;}
.cg-dest-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.cg-dest-slabel{font-size:.6rem;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.cg-dest-sval{font-size:.82rem;font-weight:700;}

/* Table */
.cg-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
.cg-table{width:100%;border-collapse:collapse;font-size:.79rem;}
.cg-table thead{position:sticky;top:0;z-index:2;}
.cg-table thead th{background:var(--bg2);padding:10px 12px;color:var(--sub);font-weight:700;font-size:.63rem;text-transform:uppercase;letter-spacing:.45px;white-space:nowrap;border-bottom:1px solid var(--border);}
.cg-table thead th:first-child{border-radius:10px 0 0 0;}
.cg-table thead th:last-child{border-radius:0 10px 0 0;}
.cg-day-row td{background:#0d1826;padding:10px 12px;font-weight:700;font-size:.78rem;border-bottom:1px solid var(--border);border-top:2px solid rgba(244,117,35,.25);}
.cg-day-label{color:var(--orange);letter-spacing:.04em;}
.cg-day-ops{margin-left:10px;font-size:.68rem;font-weight:500;color:var(--sub);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:10px;}
.cg-op-row td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s;}
.cg-op-row:hover td{background:rgba(255,255,255,.025);}
.cg-alt td{background:rgba(255,255,255,.015);}
.cg-table tbody tr:last-child td{border-bottom:none;}
.cg-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.dl-btn-hist{background:rgba(68,114,196,.18);color:#7ba8d9;border:1px solid rgba(68,114,196,.35);border-radius:5px;padding:3px 8px;font-size:.68rem;cursor:pointer;white-space:nowrap;transition:background .2s;}
.dl-btn-hist:hover{background:rgba(68,114,196,.38);}
/* ── Consolidado Geral — blocos por dia ── */
.cg-blocos-wrap{display:flex;flex-direction:column;gap:18px;}
.cg-day-block{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.cg-day-header-bar{display:flex;align-items:center;gap:10px;background:#0d1826;padding:10px 14px;border-bottom:1px solid var(--border);}
.cg-day-label{font-weight:700;font-size:.82rem;color:var(--fg);}
.cg-day-ops{font-size:.72rem;color:var(--sub);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:20px;}
/* duas tabelas: thead fixa + tbody em div scrollável */
.cg-t{width:100%;border-collapse:collapse;table-layout:fixed;}
.cg-t thead th{background:var(--bg2);padding:10px 12px;color:var(--sub);font-weight:700;font-size:.63rem;text-transform:uppercase;letter-spacing:.45px;white-space:nowrap;border-bottom:1px solid var(--border);}
.cg-body-scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(100,120,140,.35) transparent;}
.cg-body-scroll::-webkit-scrollbar{width:8px;background:transparent;}
.cg-body-scroll::-webkit-scrollbar-track{background:transparent;}
.cg-body-scroll::-webkit-scrollbar-thumb{background:rgba(100,120,140,.35);border-radius:4px;}
.cg-body-scroll::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.55);}
/* gutter-pad: fundo deve combinar com a linha correspondente */
.cg-gutter-head{background:var(--bg2);}
.cg-gutter-tot{background:rgba(244,117,35,.07);border-top:2px solid rgba(244,117,35,.3);}
/* linha TOTAL */
.cg-total-row td{padding:10px 12px;background:rgba(244,117,35,.07);border-top:2px solid rgba(244,117,35,.3);font-weight:700;font-size:.8rem;}
.cg-total-lbl{color:var(--orange);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.cg-total-val{font-variant-numeric:tabular-nums;}
.cg-num-fat{color:#7ba8d9;}
.cg-td-nome{font-weight:600;}
.cg-td-vei{color:var(--sub);}
.cg-td-trecho{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub);font-size:.72rem;}
.cg-td-ct{font-size:.75rem;color:var(--sub);white-space:nowrap;}
.cg-ct-sep{margin:0 4px;opacity:.4;}

/* Tipo badges */
.cg-tipo-frac{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.2px;background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.2);}
.cg-tipo-fech{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.2px;background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.2);}

/* Status badges */
.cg-st-ok{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.2px;background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);white-space:nowrap;}
.cg-st-bad{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.2px;background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);white-space:nowrap;}
.cg-st-warn{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.2px;background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.2);white-space:nowrap;}
@media(max-width:900px){.cg-charts-row{grid-template-columns:1fr;}.cg-dest-row{grid-template-columns:1fr;}.cg-dest-stats{grid-template-columns:1fr 1fr;}}
</style>
</head><body>

function sbadge(st){

}

function _geralAtivo(){

}

function _geralRender(){
  const HIST=_geralAtivo();
  const el2=document.getElementById('cg-body');
  if(!el2)return;
  if(!HIST.length){el2.innerHTML='<p style="color:var(--sub);text-align:center;padding:40px;">Nenhuma operação para o período selecionado.</p>';return;}

  const tot=HIST.reduce((a,o)=>({fat:a.fat+o.fat,res:a.res+o.res,ctes:a.ctes+o.ctes}),{fat:0,res:0,ctes:0});
  const mg=tot.fat?tot.res/tot.fat:0;

  const abaixo=HIST.filter(o=>o.status==='ABAIXO DO TARGET').length;

  // KPIs
  const kpis='<div class="cg-kpi-row">'

      +'<div class="cg-dest-nome">'+op.nome+'</div>'
      +'<div class="cg-dest-sub">'+op.dia+' &nbsp;·&nbsp; '+op.tipo+' &nbsp;·&nbsp; '+op.vei+'</div>'
      +'<div class="cg-dest-trecho" title="'+op.trecho+'">📍 '+op.trecho+'</div>'
      +'<div class="cg-dest-stats">'
        +'<div><div class="cg-dest-slabel">Faturamento</div><div class="cg-dest-sval">'+fmt(op.fat)+'</div></div>'
        +'<div><div class="cg-dest-slabel">Resultado</div><div class="cg-dest-sval" style="color:'+cor+';">'+fmt(op.res)+'</div></div>'
        +'<div><div class="cg-dest-slabel">Margem</div><div class="cg-dest-sval" style="color:'+cor+';">'+pct(op.mg)+'</div></div>'
        +'<div><div class="cg-dest-slabel">C.Transf</div><div class="cg-dest-sval">'+fmt(op.c_transf)+'</div></div>'
      +'</div></div>';
  }
  const destaques='<div class="cg-dest-row">'+destCard(melhor,'melhor')+destCard(pior,'pior')+'</div>';

  // Duas tabelas separadas: thead fixa + tbody scrollável
  // 12 colunas: adicionada coluna Trecho após Veículo
  const COLS=['11%','8%','7%','14%','4%','10%','10%','6%','14%','7%','11%','5%'];
  const ALIGNS=['left','left','left','left','right','right','right','right','left','right','left','left'];
  const COG=COLS.map(w=>'<col style="width:'+w+';">').join('');
  const TH_LABELS=['Operador','Tipo','Veículo','Trecho','CTEs','Faturamento','Resultado','Margem','C.Transf / Target','Dif','Status','Detalhe'];
  const TH_ROW='<tr>'+TH_LABELS.map((l,i)=>'<th style="text-align:'+ALIGNS[i]+';">'+l+'</th>').join('')+'</tr>';

  const ROW_H=44;
  const MAX_VIS=4;

  let blocos='';
  dias.forEach(dia=>{
    const ops=HIST.filter(o=>o.dia===dia);
    const df=ops.reduce((a,o)=>({fat:a.fat+o.fat,res:a.res+o.res,ctes:a.ctes+o.ctes}),{fat:0,res:0,ctes:0});
    const dm=df.fat?df.res/df.fat:0;
    const scrolls=ops.length>MAX_VIS;

    let opRows='';
    ops.forEach(function(o,i){
      const stIcon=o.status==='DENTRO DO TARGET'?'✔':o.status==='FORA DO TARGET'?'✗':'↓';
      const stCls =o.status==='DENTRO DO TARGET'?'cg-st-ok':o.status==='FORA DO TARGET'?'cg-st-bad':'cg-st-warn';
      const tipoCls=o.tipo==='FRACIONADO'?'cg-tipo-frac':'cg-tipo-fech';
      opRows+='<tr class="cg-op-row'+(i%2===1?' cg-alt':'')+'">'
        +'<td class="cg-td-nome">'+o.nome+'</td>'
        +'<td><span class="'+tipoCls+'">'+o.tipo+'</span></td>'
        +'<td class="cg-td-vei">'+o.vei+'</td>'
        +'<td class="cg-td-trecho" title="'+o.trecho+'">'+o.trecho+'</td>'
        +'<td class="cg-num">'+o.ctes+'</td>'
        +'<td class="cg-num cg-num-fat">'+fmt(o.fat)+'</td>'
        +'<td class="cg-num '+mgnum(o.mg)+'">'+fmt(o.res)+'</td>'
        +'<td class="cg-num '+mgcl(o.mg)+'">'+pct(o.mg)+'</td>'
        +'<td class="cg-td-ct">'+fmt(o.c_transf)+'<span class="cg-ct-sep">/</span>'+fmt(o.target)+'</td>'
        +'<td class="cg-num '+mgnum(o.dif)+'">'+fmt(o.dif)+'</td>'
        +'<td><span class="'+stCls+'">'+stIcon+' '+o.status+'</span></td>'
        +'<td><button class="dl-btn-hist" onclick="dlHistExcel(\''+o.nome+'\',\''+o.dia+'\')">⬇ XLS</button></td>'
        +'</tr>';
    });

    const bodyH=Math.min(ops.length,MAX_VIS)*ROW_H;

    blocos+='<div class="cg-day-block">'
      +'<div class="cg-day-header-bar">'
        +'<span class="cg-day-label">📅 '+dia+'</span>'
        +'<span class="cg-day-ops">'+ops.length+' operaç'+(ops.length>1?'ões':'ão')+'</span>'
      +'</div>'
      // thead fixa acima do scroll (bg e padding-right ajustados via classe + JS)
      +'<div class="cg-gutter-pad cg-gutter-head">'
        +'<table class="cg-t"><colgroup>'+COG+'</colgroup><thead>'+TH_ROW+'</thead></table>'
      +'</div>'
      // corpo scrollável
      +'<div class="cg-body-scroll" style="max-height:'+bodyH+'px;">'
        +'<table class="cg-t"><colgroup>'+COG+'</colgroup><tbody>'+opRows+'</tbody></table>'
      +'</div>'
      // linha TOTAL abaixo do scroll (bg e padding-right via classe + JS)
      // 12 colunas: colspan=5 cobre Operador,Tipo,Veículo,Trecho,CTEs → fat=col6, res=col7, mg=col8, ctes=col9, empty=cols10-12
      +'<div class="cg-gutter-pad cg-gutter-tot">'
        +'<table class="cg-t cg-total-table"><colgroup>'+COG+'</colgroup>'
          +'<tbody><tr class="cg-total-row">'
            +'<td class="cg-total-lbl" colspan="5">📊 TOTAL DO DIA</td>'
            +'<td class="cg-num cg-num-fat cg-total-val">'+fmt(df.fat)+'</td>'
            +'<td class="cg-num '+mgnum(dm)+' cg-total-val">'+fmt(df.res)+'</td>'
            +'<td class="cg-num '+mgcl(dm)+' cg-total-val">'+pct(dm)+'</td>'
            +'<td class="cg-total-val" style="color:var(--sub);font-size:.72rem;">'+df.ctes+' CTEs</td>'
            +'<td colspan="3"></td>'
          +'</tr></tbody>'
        +'</table>'
      +'</div>'
    +'</div>';
  });

  const tabela='<div class="cg-blocos-wrap">'+blocos+'</div>';

  el2.innerHTML=kpis+charts+destaques+tabela;

  // Alinha colunas: compensa largura real do scrollbar em cada bloco com scroll
  (function(){
    var d=document.createElement('div');
    d.style.cssText='width:100px;height:50px;overflow-y:scroll;scrollbar-width:thin;visibility:hidden;position:fixed;left:-9999px;';
    document.body.appendChild(d);
    var sw=d.offsetWidth-d.clientWidth;
    document.body.removeChild(d);
    if(!sw) return;
    document.querySelectorAll('.cg-body-scroll').forEach(function(sc){
      if(sc.scrollHeight>sc.clientHeight){
        var block=sc.closest('.cg-day-block');
        if(!block) return;
        block.querySelectorAll('.cg-gutter-pad').forEach(function(el){
          el.style.paddingRight=sw+'px';
          el.style.boxSizing='border-box';
        });
      }
    });
  })();

  // Build charts
  if(_lineChart){try{_lineChart.destroy();}catch(e){}}
  if(_donutChart){try{_donutChart.destroy();}catch(e){}}
  const _tc='#9baab8';const _gc='rgba(30,42,58,0.7)';

  _lineChart=new Chart(document.getElementById('cg-line'),{
    type:'bar',
    data:{
      labels:dias,
      datasets:[
        {type:'bar',label:'Faturamento',data:dFat,
         backgroundColor:'rgba(68,114,196,.65)',borderRadius:5,borderSkipped:false,yAxisID:'y',order:2},
        {type:'bar',label:'Resultado',data:dRes,
         backgroundColor:dRes.map(function(v){return v>=0?'rgba(34,197,94,.75)':'rgba(239,68,68,.75)';}),
         borderRadius:5,borderSkipped:false,yAxisID:'y',order:3},
        {type:'line',label:'Margem %',data:dMg,
         borderColor:'#f28c28',backgroundColor:'rgba(242,140,40,.06)',
         pointBackgroundColor:'#f28c28',pointBorderColor:'#111c2e',pointBorderWidth:2,
         pointRadius:6,pointHoverRadius:9,tension:0.4,fill:true,
         borderWidth:2.5,yAxisID:'pct',order:1}
      ]
    },
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:_tc,font:{size:11},usePointStyle:true,padding:14}},
        tooltip:{backgroundColor:'rgba(8,15,28,.95)',titleColor:'#e2e8f0',bodyColor:'#94a3b8',
          borderColor:'rgba(255,255,255,.07)',borderWidth:1,padding:12,cornerRadius:8,
          callbacks:{label:function(c){
            if(c.dataset.yAxisID==='pct')return' '+c.dataset.label+': '+c.parsed.y.toFixed(1)+'%';
            return' '+c.dataset.label+': R$ '+c.parsed.y.toLocaleString('pt-BR',{minimumFractionDigits:2});
          }}}
      },
      scales:{
        y:{position:'left',grid:{color:_gc},border:{color:'transparent'},
           ticks:{color:_tc,font:{size:10},callback:function(v){return'R$'+(Math.abs(v)>=1000?(v/1000).toFixed(0)+'k':v.toLocaleString('pt-BR'));}}},
        pct:{position:'right',grid:{drawOnChartArea:false},border:{color:'transparent'},
             ticks:{color:'#f28c28',font:{size:10},callback:function(v){return v.toFixed(0)+'%';}}},
        x:{grid:{color:_gc},border:{color:'transparent'},ticks:{color:_tc,font:{size:10}}}
      }
    }
  });

  _donutChart=new Chart(document.getElementById('cg-donut'),{
    type:'doughnut',
    data:{
      labels:['Dentro do Target','Fora do Target','Abaixo do Target'],
      datasets:[{
        data:[dentro,fora,abaixo],
        backgroundColor:['rgba(34,197,94,.85)','rgba(239,68,68,.85)','rgba(59,130,246,.85)'],
        borderColor:['rgba(34,197,94,1)','rgba(239,68,68,1)','rgba(59,130,246,1)'],
        borderWidth:2,hoverOffset:8
      }]
    },
    options:{
      responsive:true,cutout:'70%',
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'rgba(8,15,28,.95)',titleColor:'#e2e8f0',bodyColor:'#94a3b8',
          padding:10,cornerRadius:8,
          callbacks:{label:function(c){return' '+c.label+': '+c.parsed+' op'+(c.parsed!==1?'s':'');}}}
      }
    }
  });
}

function buildConsolidadoGeral(){
  const el=document.getElementById('main-content');
  if(!HIST_MES||!HIST_MES.length){
    el.innerHTML='<div class="card"><p>Sem dados históricos disponíveis.</p></div>';return;
  }
  el.innerHTML='<div class="card">'
    +'<div class="cg-header">'
      +'<div><h2 style="margin:0;font-size:1.1rem;font-weight:700;letter-spacing:.02em;">Consolidado Geral</h2>'
      +'<p style="margin:4px 0 0;font-size:.75rem;color:var(--sub);">Análise consolidada por período</p></div>'
      +'<div class="cg-filter-bar">'
        +'<span class="cg-filter-label">Período</span>'
        +'<input type="date" id="cg-ini" value="'+_geralIni+'" class="cg-date-input" onchange="_geralIni=this.value;_geralRender();">'
        +'<span class="cg-filter-sep">→</span>'
        +'<input type="date" id="cg-fim" value="'+_geralFim+'" class="cg-date-input" onchange="_geralFim=this.value;_geralRender();">'
      +'</div>'
    +'</div>'
    +'<div id="cg-body"></div>'
    +'</div>';
  _geralRender();
}

</script></body></html>
